name: rigour-supply-chain-local

services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?set LOCAL_MYSQL_ROOT_PASSWORD in a local .env file}
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-rigour_local}
      MYSQL_USER: ${LOCAL_MYSQL_USER:?set LOCAL_MYSQL_USER in a local .env file}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:?set LOCAL_MYSQL_PASSWORD in a local .env file}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.10-alpine
    environment:
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:?set LOCAL_REDIS_PASSWORD in a local .env file}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.3
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.3
    command: ["sh", "mqbroker", "-n", "rocketmq-nameserver:9876", "--enable-proxy"]
    depends_on:
      - rocketmq-nameserver
    ports:
      # 宿主机 8081 已分配给 tenant-iam-service；18081 仅用于本地 RocketMQ Proxy。
      - "18081:8081"
      - "10909:10909"
      - "10911:10911"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LOCAL_MINIO_ROOT_USER:?set LOCAL_MINIO_ROOT_USER in a local .env file}
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_ROOT_PASSWORD:?set LOCAL_MINIO_ROOT_PASSWORD in a local .env file}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  redis-data:
  minio-data:

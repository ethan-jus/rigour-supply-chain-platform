# 台式机开发使用 HTTP；API 经同源 Gateway，不需要浏览器跨域配置。
server {
    listen 5100;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    # 与 Vite 保持相同的认证白名单。issuer 不变，浏览器只访问 Web 同源地址。
    location ~ ^/auth/(scdp/(session|login|logout)|oauth2/(authorize|token|jwks)|\.well-known/openid-configuration)$ {
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:26881;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cookie_path / /auth;
        proxy_redirect ~^(?:https?://[^/]+)?/login(?:\?.*)?$ "/#/login?reason=reauthenticate";
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
    location /auth/ {
        return 404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:26880;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Nacos Data ID: rigour-erp-core-service.yaml
# Namespace: dev / 3aa03547-8948-4254-bd94-47c630db128b
# 密码只从本机 Secret、IDEA 环境变量或部署平台注入，不要替换为明文。
spring:
  datasource:
    url: jdbc:mysql://82.157.4.176:13306/rigour_erp?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=PREFERRED&allowPublicKeyRetrieval=true
    username: rigour_erp_app
    password: ${ERP_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    # ERP 已包含商品主数据 V1 迁移；共享 DEV 启动时执行并校验后续迁移。
    enabled: true
    url: jdbc:mysql://82.157.4.176:13306/rigour_erp?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=PREFERRED&allowPublicKeyRetrieval=true
    user: rigour_erp_migrator
    password: ${ERP_DB_MIGRATOR_PASSWORD}
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

rigour:
  business-settings:
    base-url: http://rigour-business-settings-service:26892
  integration:
    base-url: http://rigour-integration-migration-service:26882
    http:
      # 商品图片在 Integration 内完成下载和 COS 上传后才返回商品页。
      connect-timeout: 3s
      read-timeout: 120s
  erp:
    product-media:
      # 图片必须写入 COS 私桶；ERP 查询商品时按 object key 重新生成短时 URL。
      url-ttl: 10m
      cos:
        # region/bucket 是非敏感资源标识；此处可填写 ERP 与 Integration 共用的实际私桶值。
        object-prefix: product-images
        region: ap-beijing
        bucket: rigour-sales-recordings-1361731487
        # SecretId/SecretKey 只从部署 Secret 注入；缺失时 ERP 启动失败，不降级本地文件。
        secret-id: ${RIGOUR_ERP_PRODUCT_MEDIA_COS_SECRET_ID:}
        secret-key: ${RIGOUR_ERP_PRODUCT_MEDIA_COS_SECRET_KEY:}
        # 仅 STS 临时凭据模式需要；长期 CAM 密钥模式保持为空。
#        session-token: ${RIGOUR_ERP_PRODUCT_MEDIA_COS_SESSION_TOKEN:}
        connection-timeout-ms: 5000
        socket-timeout-ms: 30000
    context:
      trust:
        active-key-id: v1
        keys-base64:
          v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

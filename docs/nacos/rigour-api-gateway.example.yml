# Nacos dataId: rigour-api-gateway.yaml
# 共享DEV的非敏感安全开关和超时配置放在Nacos；HMAC密钥仍由Secret注入。
rigour:
  gateway:
    security:
      enabled: true
      audience:
        - rigour-api
      # 正确性优先：开启后每次受保护请求向IAM确认当前会话/版本。IAM拒绝返401，IAM故障返503。
      # security开启时此项必须为true，否则Gateway拒绝启动。
      current-token-validation-enabled: true
      current-token-connect-timeout: 2s
      current-token-read-timeout: 3s

# 路由清单由Gateway仓库application.yml统一维护。Nacos不得配置不完整的routes列表，
# 否则Spring列表覆盖会使其他业务服务路由消失。
# `/api/v1/token/current`仅供Gateway通过IAM内部地址调用，不对浏览器路由。

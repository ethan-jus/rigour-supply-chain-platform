# Nacos Data ID: rigour-merchant-crm-service.yaml
# Namespace: dev / 3aa03547-8948-4254-bd94-47c630db128b
# 密码只从本机 Secret、IDEA 环境变量或部署平台注入，不要替换为明文。
spring:
  datasource:
    url: jdbc:mysql://82.157.4.176:13306/rigour_crm?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=PREFERRED&allowPublicKeyRetrieval=true
    username: rigour_crm_app
    password: ${CRM_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    # CRM 已提供正式 V1 迁移；应用启动前由专用迁移账号执行结构校验与迁移。
    enabled: true
    url: jdbc:mysql://82.157.4.176:13306/rigour_crm?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=PREFERRED&allowPublicKeyRetrieval=true
    user: rigour_crm_migrator
    password: ${CRM_DB_MIGRATOR_PASSWORD}
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

rigour:
  integration:
    http:
      # 商品图片在 Integration 内完成下载和 COS 上传后才返回商品页。
      connect-timeout: 3s
      read-timeout: 120s
  crm:
    sync:
      # ERP统一定时同步默认关闭；确认 Integration 目标和数据库后再打开。
      enabled: true
      cron: 0 0/30 * * * ?
      max-pages: 100
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

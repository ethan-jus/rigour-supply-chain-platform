# 密码只从本机 Secret、IDEA 环境变量或部署平台注入，不要替换为明文。
spring:
  datasource:
    url: jdbc:mysql://82.157.4.176:13306/rigour_sales_work?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=PREFERRED&allowPublicKeyRetrieval=true
    username: rigour_sales_work_app
    password: ${SALES_WORK_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    # 源码已有Sales Work V1；复制到真实Nacos前必须确认迁移账号Secret和共享DEV变更窗口。
    enabled: true
    url: jdbc:mysql://82.157.4.176:13306/rigour_sales_work?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=PREFERRED&allowPublicKeyRetrieval=true
    user: rigour_sales_work_migrator
    password: ${SALES_WORK_DB_MIGRATOR_PASSWORD}
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

rigour:
  amap:
    base-url: https://restapi.amap.com/v3
    web-key: ${RIGOUR_AMAP_WEB_KEY}
    connect-timeout: 3s
    read-timeout: 5s
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

sales:
  recording:
    # 非敏感项直接保存在 Nacos；当前环境使用北京地域的私有 COS 存储桶。
    storage-type: cos
    storage-dir: /opt/rigour-dev/data/sales-recordings
    max-clip-bytes: 26214400
    minimum-clip-seconds: 30
    cos:
      region: ap-beijing
      bucket: rigour-sales-recordings-1361731487
      # 当前使用长期 CAM 密钥：SecretId/SecretKey 由部署 Secret 注入，不写入 Nacos。
      secret-id: ${RIGOUR_SALES_RECORDING_COS_SECRET_ID:}
      secret-key: ${RIGOUR_SALES_RECORDING_COS_SECRET_KEY:}
      # 只有切换到 STS 临时凭据时才增加 session-token；长期密钥模式不要配置。
      connection-timeout-ms: 5000
      socket-timeout-ms: 30000
      server-side-encryption: true

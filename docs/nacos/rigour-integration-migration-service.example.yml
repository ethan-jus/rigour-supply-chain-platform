# DEV共享配置：非敏感连接参数写入Nacos；数据库密码和上下文密钥由本机Secret/IDEA环境变量注入。
# 该文件对应 Nacos Data ID: rigour-integration-migration-service.yaml，Group: DEFAULT_GROUP。
spring:
  servlet:
    multipart:
      max-file-size: ${RIGOUR_FEISHU_IMPORT_MAX_FILE_SIZE:50MB}
      max-request-size: ${RIGOUR_FEISHU_IMPORT_MAX_REQUEST_SIZE:60MB}
  datasource:
    # 共享DEV数据库；不要改成 localhost，也不要把密码写进这个文件。
    url: jdbc:mysql://82.157.4.176:13306/rigour_integration?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: rigour_integration_app
    password: ${INTEGRATION_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 运行时账号只读写表，不拥有DDL权限；连接池大小按共享DEV容量控制。
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    # 迁移账号与运行时账号分离；生产/DEV均禁止Flyway clean。
    url: jdbc:mysql://82.157.4.176:13306/rigour_integration?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    user: rigour_integration_migrator
    password: ${INTEGRATION_DB_MIGRATOR_PASSWORD}
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

rigour:
  erp:
    # Integration编排器只通过ERP内部HTTP同步契约调度，不访问ERP数据库。
    base-url: ${RIGOUR_ERP_BASE_URL:http://rigour-erp-core-service:26884}
  crm:
    # Integration编排器只通过CRM内部HTTP同步契约调度，不访问CRM数据库。
    base-url: ${RIGOUR_CRM_BASE_URL:http://rigour-merchant-crm-service:26883}
  order:
    # Integration投影订货宝订单到Order自研销售订单；只调用HTTP契约，不访问Order数据库。
    base-url: ${RIGOUR_ORDER_BASE_URL:http://rigour-order-center-service:26885}
  hr:
    # Integration投影飞书人员到HR员工主档；IAM只保留认证授权边界。
    base-url: ${RIGOUR_HR_BASE_URL:http://rigour-hr-payroll-service:26889}
  business-settings:
    # Integration同步批次内只通过Settings内部HTTP契约补齐已确认的白名单业务字典项。
    base-url: ${RIGOUR_BUSINESS_SETTINGS_BASE_URL:http://rigour-business-settings-service:26892}
  integration:
    domain-http:
      # 统一编排器调用ERP/CRM/Order时按小批次推进，单次慢请求失败后进入行级问题而不是卡住整批。
      connect-timeout: 5s
      read-timeout: 120s
    connector-lease:
      # ERP、CRM、Order及各自多实例的一整轮同步共享同一租户连接器租约。
      ttl: 2m
    dhb:
      orchestration:
        # 定时统一同步默认关闭；不影响 Portal 手动统一同步入口。
        enabled: ${RIGOUR_DHB_SYNC_ORCHESTRATION_ENABLED:false}
        cron: ${RIGOUR_DHB_SYNC_ORCHESTRATION_CRON:0 5/30 * * * ?}
        max-pages: ${RIGOUR_DHB_SYNC_ORCHESTRATION_MAX_PAGES:100}
        # enabled=true 时必须配置；例如 2026-09-01 会按系统时区当天 00:00:00 作为起点。
        scheduled-window-from: ${RIGOUR_DHB_SYNC_ORCHESTRATION_SCHEDULED_WINDOW_FROM:}
      order:
        # getOrderContent/getShipsContent 明细接口按单号调用；该值受订货宝限流和下方 client 限流共同约束。
        detail-concurrency: 4
      client:
        # 订货宝 API base_url 仍由租户连接器保存；相对商品图片地址单独解析到图片源站。
        image-base-url: ${RIGOUR_INTEGRATION_DHB_IMAGE_BASE_URL:https://img.dhb168.com/}
    product-media:
      # Integration 只负责下载订货宝图片并上传私桶，不向 Portal 返回永久公开地址。
      max-bytes: 10485760
      # 持久化图片任务由固定并发消费者处理；不要配置成无限并发。
      worker-concurrency: 4
      worker-poll-interval-ms: 1000
      worker-max-attempts: 3
      fund-attachment-prefix: fund-attachments
      feishu-attachment-prefix: feishu-attachments
      cos:
        object-prefix: product-images
        region: ap-beijing
        bucket: rigour-sales-recordings-1361731487
        secret-id: ${RIGOUR_INTEGRATION_PRODUCT_MEDIA_COS_SECRET_ID:}
        secret-key: ${RIGOUR_INTEGRATION_PRODUCT_MEDIA_COS_SECRET_KEY:}
#        session-token: ${RIGOUR_INTEGRATION_PRODUCT_MEDIA_COS_SESSION_TOKEN:}
        connection-timeout-ms: 5000
        socket-timeout-ms: 60000
        server-side-encryption: true
    feishu:
      # DEV/local调试保留localhost；私网HTTP来源由服务动态匹配，不填写任何开发机IP。
      allowed-origins: http://localhost:5200
      # 只适用于共享DEV；生产必须为false，并配置明确HTTPS来源。
      allow-insecure-lan: true
      import-bundle:
        enabled: ${RIGOUR_FEISHU_IMPORT_BUNDLE_ENABLED:true}
        max-bytes: ${RIGOUR_FEISHU_IMPORT_BUNDLE_MAX_BYTES:104857600}
        # 页面未填写飞书Base/视图地址时使用；按环境配置，不要写入App Secret。
        default-source-url: ${RIGOUR_FEISHU_IMPORT_BUNDLE_DEFAULT_SOURCE_URL:}
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

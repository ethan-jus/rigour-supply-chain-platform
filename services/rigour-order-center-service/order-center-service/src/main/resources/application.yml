# 订单中心通用配置：不区分DEV/本机启动方式，也不保存数据库密码等环境Secret。
server:
  # 本机启动的固定端口；Gateway默认将 /api/v1/orders/** 转发到此端口。
  port: 26885

spring:
  application:
    # 同时作为Nacos Data ID前缀，DEV会读取 rigour-order-center-service.yaml。
    name: rigour-order-center-service

management:
  endpoints:
    web:
      exposure:
        # 只暴露基础健康和版本信息，不对外暴露env/configprops等敏感端点。
        include: health,info
  endpoint:
    health:
      # 详细健康信息仅在已授权时返回。
      show-details: when_authorized

logging:
  level:
    # 业务日志默认INFO；不得记录Bearer Token、HMAC密钥、数据库密码或订货宝凭据。
    com.rigour: INFO

mybatis-plus:
  configuration:
    # 将数据库 snake_case 字段自动映射为Java camelCase属性。
    map-underscore-to-camel-case: true
  global-config:
    # 关闭MyBatis-Plus启动Banner，减少无关日志。
    banner: false

rigour:
  order:
    dhb:
      sync:
        # Order Center内部定时同步开关；启用后从Integration动态发现租户目标。
        enabled: ${RIGOUR_ORDER_DHB_SYNC_ENABLED:false}
        # Spring六字段cron：每小时00分和30分执行，秒 分 时 日 月 周。
        cron: ${RIGOUR_ORDER_DHB_SYNC_CRON:0 0/30 * * * ?}
        # 单次同步最大页数，范围1..100；供应商数据过大时分批运行。
        max-pages: ${RIGOUR_ORDER_DHB_SYNC_MAX_PAGES:100}
        # 增量窗口向前重叠分钟数，默认5分钟；依靠业务键和payloadHash幂等。
        overlap-minutes: ${RIGOUR_ORDER_DHB_SYNC_OVERLAP_MINUTES:5}
  integration:
    # Order Center只调用Integration版本化HTTP契约，不直接访问订货宝或Integration数据库。
    base-url: ${RIGOUR_INTEGRATION_BASE_URL:http://localhost:26882}
  context:
    trust:
      # 当前主动签名/验签密钥版本；轮换密钥时按v1、v2递增。
      active-key-id: v1
      # Gateway与所有下游服务必须注入同一份Base64 HMAC密钥。
      # 环境变量名与Spring属性名不同，必须保留此映射；真实值不进Nacos或Git。
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

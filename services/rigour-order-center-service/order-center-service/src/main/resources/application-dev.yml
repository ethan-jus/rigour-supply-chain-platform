# DEV配置：连接共享Nacos并读取共享数据库参数；真实密码仍由进程环境Secret注入。
spring:
  config:
    # DEV必须读取共享Nacos；鉴权或配置失败时直接停止启动，避免服务“端口已起但配置不完整”。
    # refreshEnabled只用于刷新非敏感运行参数；HMAC和数据库密码不放入Nacos。
    import: nacos:${spring.application.name}.yaml?refreshEnabled=true
  cloud:
    nacos:
      # Nacos HTTP/API端口；客户端会自动使用派生的gRPC端口，不要手动改成19848。
      server-addr: 82.157.4.176:18848
      # 用户名可使用DEV默认值；密码必须在IDEA或当前终端显式注入。
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD}
      config:
        # 配置中心固定读取共享DEV Namespace。
        namespace: ${NACOS_NAMESPACE:3aa03547-8948-4254-bd94-47c630db128b}
      discovery:
        # 与配置中心使用同一DEV Namespace；是否注册由local覆盖层决定。
        namespace: ${NACOS_NAMESPACE:3aa03547-8948-4254-bd94-47c630db128b}

server:
  port: 26882

spring:
  application:
    name: rigour-integration-migration-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO
    # 只记录租户、连接器、函数、分页和耗时；订货宝 token、密码和原始回执不会写入日志。
    com.rigour.integration.infrastructure.dhb: INFO

rigour:
  erp:
    # Integration编排器只通过ERP内部HTTP同步契约调度，不访问ERP数据库。
    base-url: ${RIGOUR_ERP_BASE_URL:http://localhost:26884}
  crm:
    # Integration编排器只通过CRM内部HTTP同步契约调度，不访问CRM数据库。
    base-url: ${RIGOUR_CRM_BASE_URL:http://localhost:26883}
  order:
    # 订货宝订单同步只投影到Order自研销售订单HTTP契约，不访问Order数据库。
    base-url: ${RIGOUR_ORDER_BASE_URL:http://localhost:26885}
  business-settings:
    # 订货宝同步批次内只通过Settings内部HTTP契约幂等补齐白名单业务字典。
    base-url: ${RIGOUR_BUSINESS_SETTINGS_BASE_URL:http://localhost:26892}
  integration:
    domain-http:
      # 统一编排器调用ERP/CRM/Order时允许长批次完成；单领域内部仍负责自己的分页和幂等。
      connect-timeout: ${RIGOUR_INTEGRATION_DOMAIN_HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${RIGOUR_INTEGRATION_DOMAIN_HTTP_READ_TIMEOUT:15m}
    connector-lease:
      # ERP、CRM、Order及多实例对同一租户连接器共用此分布式租约。
      ttl: ${RIGOUR_INTEGRATION_CONNECTOR_LEASE_TTL:2m}
    product-media:
      # 订货宝图片强制写入 COS 私桶；缺少 COS 配置时服务启动失败，不降级到本地文件。
      max-bytes: 10485760
      # 图片任务由持久化队列驱动；每个实例最多4个并发下载/上传任务。
      worker-concurrency: 4
      worker-poll-interval-ms: 1000
      worker-max-attempts: 3
      cos:
        # 非敏感项由 Nacos/环境配置；Secret 只从部署环境注入。
        object-prefix: ${RIGOUR_INTEGRATION_PRODUCT_MEDIA_COS_OBJECT_PREFIX:product-images}
        region:
        bucket:
        secret-id: ${RIGOUR_INTEGRATION_PRODUCT_MEDIA_COS_SECRET_ID:}
        secret-key: ${RIGOUR_INTEGRATION_PRODUCT_MEDIA_COS_SECRET_KEY:}
        session-token: ${RIGOUR_INTEGRATION_PRODUCT_MEDIA_COS_SESSION_TOKEN:}
        connection-timeout-ms: 5000
        socket-timeout-ms: 60000
        server-side-encryption: true
    dhb:
      orchestration:
        # 订货宝同步统一由Integration编排器触发；领域服务定时入口默认关闭。
        enabled: ${RIGOUR_DHB_SYNC_ORCHESTRATION_ENABLED:true}
        cron: ${RIGOUR_DHB_SYNC_ORCHESTRATION_CRON:0 5/30 * * * ?}
        max-pages: ${RIGOUR_DHB_SYNC_ORCHESTRATION_MAX_PAGES:100}
      order:
        # getOrderContent/getShipsContent 明细接口按单号调用；默认3路受限并发，正式上线前以订货宝确认的限流阈值覆盖。
        detail-concurrency: ${RIGOUR_DHB_ORDER_DETAIL_CONCURRENCY:3}
      client:
        # 订货宝正式 API 基础 URL 必须配置在租户连接器的 base_url 中；商品图片相对地址使用独立源站。
        image-base-url: ${RIGOUR_INTEGRATION_DHB_IMAGE_BASE_URL:https://img.dhb168.com/}
        # 下面是本地客户端策略，不是订货宝官方承诺的限流值。正式上线前以订货宝确认的阈值覆盖。
        connect-timeout: 3s
        read-timeout: 15s
        max-attempts: 3
        initial-backoff: 200ms
        max-backoff: 3s
        requests-per-second: 5
        rate-limit-burst: 5
        # getTokenValue 返回 expires_in；在到期前提前刷新，避免同步过程中使用临界 token。
        token-safety-window: 60s
    feishu:
      # 本机 dev,local 的 App ID 与 H5 来源在 application-local.yml；App Secret 只能通过
      # Integration 进程环境注入，不得提交到 Git、Nacos 或日志。
      app-secret: ${RIGOUR_FEISHU_APP_SECRET:}
      # 默认关闭动态局域网HTTP来源；生产只允许显式配置的HTTPS来源。
      allow-insecure-lan: false
      connect-timeout: 3s
      read-timeout: 5s
      token-safety-window: 60s
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

server:
  port: 26882

spring:
  application:
    name: rigour-integration-migration-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO
    # 只记录租户、连接器、函数、分页和耗时；订货宝 token、密码和原始回执不会写入日志。
    com.rigour.integration.infrastructure.dinghuobao: INFO

rigour:
  integration:
    dinghuobao:
      client:
        # 订货宝正式 API 基础 URL 必须配置在租户连接器的 base_url 中；文档未给出固定 URL，禁止硬编码。
        # 下面是本地客户端策略，不是订货宝官方承诺的限流值。正式上线前以订货宝确认的阈值覆盖。
        connect-timeout: 3s
        read-timeout: 15s
        max-attempts: 3
        initial-backoff: 200ms
        max-backoff: 3s
        requests-per-second: 5
        rate-limit-burst: 5
        # getTokenValue 返回 expires_in；在到期前提前刷新，避免同步过程中使用临界 token。
        token-safety-window: 60s

  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

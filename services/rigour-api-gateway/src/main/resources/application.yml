server:
  port: 26880

spring:
  application:
    name: rigour-api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: tenant-iam-portal
              uri: ${IAM_SERVICE_URL:http://localhost:26881}
              predicates:
                - Path=/api/v1/me,/api/v1/portal/**,/api/v1/management/**
            - id: tenant-iam
              uri: ${IAM_SERVICE_URL:http://localhost:26881}
              predicates:
                - Path=/api/v1/iam/**
            - id: feishu-auth
              uri: ${IAM_SERVICE_URL:http://localhost:26881}
              predicates:
                - Path=/api/v1/auth/feishu/**
            - id: feishu-platform
              uri: ${INTEGRATION_SERVICE_URL:http://localhost:26882}
              predicates:
                - Path=/api/v1/platform/feishu/**
            - id: integration-migration
              uri: ${INTEGRATION_SERVICE_URL:http://localhost:26882}
              predicates:
                - Path=/api/v1/integration/**
            - id: merchant-crm
              uri: ${CRM_SERVICE_URL:http://localhost:26883}
              predicates:
                - Path=/api/v1/crm/**
            - id: erp-core
              uri: ${ERP_SERVICE_URL:http://localhost:26884}
              predicates:
                - Path=/api/v1/erp/**
            - id: order-center
              uri: ${ORDER_SERVICE_URL:http://localhost:26885}
              predicates:
                - Path=/api/v1/orders/**
            - id: sales-work
              uri: ${SALES_SERVICE_URL:http://localhost:26886}
              predicates:
                - Path=/api/v1/sales/**
            - id: ai-agent
              uri: ${AI_SERVICE_URL:http://localhost:26887}
              predicates:
                - Path=/api/v1/ai/**
            - id: analytics-bi
              uri: ${BI_SERVICE_URL:http://localhost:26888}
              predicates:
                - Path=/api/v1/analytics/**
            - id: hr-payroll
              uri: ${HR_SERVICE_URL:http://localhost:26889}
              predicates:
                - Path=/api/v1/hr/**
            - id: city-operations
              uri: ${CITY_SERVICE_URL:http://localhost:26890}
              predicates:
                - Path=/api/v1/cities/**
            - id: channel-agent
              uri: ${CHANNEL_SERVICE_URL:http://localhost:26891}
              predicates:
                - Path=/api/v1/channels/**
            - id: business-settings
              uri: ${BUSINESS_SETTINGS_SERVICE_URL:http://localhost:26892}
              predicates:
                - Path=/api/v1/business-settings/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

rigour:
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

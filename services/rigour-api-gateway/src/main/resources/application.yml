server:
  port: 8080

spring:
  application:
    name: rigour-api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: tenant-iam
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/iam/**
            - id: integration-migration
              uri: ${INTEGRATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/integration/**
            - id: merchant-crm
              uri: ${CRM_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/crm/**
            - id: erp-core
              uri: ${ERP_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/erp/**
            - id: order-center
              uri: ${ORDER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/orders/**
            - id: sales-work
              uri: ${SALES_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/sales/**
            - id: ai-agent
              uri: ${AI_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/ai/**
            - id: analytics-bi
              uri: ${BI_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/analytics/**
            - id: hr-payroll
              uri: ${HR_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/hr/**
            - id: city-operations
              uri: ${CITY_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/v1/cities/**
            - id: channel-agent
              uri: ${CHANNEL_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/v1/channels/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

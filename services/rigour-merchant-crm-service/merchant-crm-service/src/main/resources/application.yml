server:
  port: 26883

spring:
  application:
    name: rigour-merchant-crm-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

rigour:
  business-settings:
    # CRM 通过公共客户端批量补齐明确白名单字典；服务不可用不阻断主数据落库。
    base-url: ${RIGOUR_BUSINESS_SETTINGS_BASE_URL:http://localhost:26892}
  integration:
    base-url: ${RIGOUR_INTEGRATION_BASE_URL:http://localhost:26882}
    http:
      connect-timeout: ${RIGOUR_INTEGRATION_CONNECT_TIMEOUT:3s}
      read-timeout: ${RIGOUR_INTEGRATION_READ_TIMEOUT:30s}
  crm:
    sync:
      enabled: ${RIGOUR_CRM_SYNC_ENABLED:true}
      # 默认在每小时10分、40分执行，与ERP和Order错峰。
      cron: ${RIGOUR_CRM_SYNC_CRON:0 10/30 * * * ?}
      max-pages: ${RIGOUR_CRM_SYNC_MAX_PAGES:100}
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

server:
  port: 26883

spring:
  application:
    name: rigour-merchant-crm-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

rigour:
  business-settings:
    # CRM 通过公共客户端批量补齐明确白名单字典；服务不可用不阻断主数据落库。
    base-url: ${RIGOUR_BUSINESS_SETTINGS_BASE_URL:http://localhost:26892}
  integration:
    base-url: ${RIGOUR_INTEGRATION_BASE_URL:http://localhost:26882}
    http:
      connect-timeout: ${RIGOUR_INTEGRATION_CONNECT_TIMEOUT:3s}
      read-timeout: ${RIGOUR_INTEGRATION_READ_TIMEOUT:120s}
  crm:
    dhb:
      # 客户数据单页过大会拖慢Integration和订货宝响应；默认小批量换稳定性，最大500。
      page-size: ${RIGOUR_CRM_DHB_PAGE_SIZE:100}
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

server:
  port: 26883

spring:
  application:
    name: rigour-merchant-crm-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

rigour:
  integration:
    base-url: ${RIGOUR_INTEGRATION_BASE_URL:http://localhost:26882}
    http:
      connect-timeout: ${RIGOUR_INTEGRATION_CONNECT_TIMEOUT:3s}
      read-timeout: ${RIGOUR_INTEGRATION_READ_TIMEOUT:30s}
  crm:
    sync:
      enabled: ${RIGOUR_CRM_SYNC_ENABLED:true}
      cron: ${RIGOUR_CRM_SYNC_CRON:0 0/30 * * * }
      max-pages: ${RIGOUR_CRM_SYNC_MAX_PAGES:100}
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

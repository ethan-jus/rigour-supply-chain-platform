server:
  port: 26886

spring:
  application:
    name: rigour-sales-work-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

rigour:
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}
  amap:
    base-url: ${RIGOUR_AMAP_BASE_URL:https://restapi.amap.com/v3}
    web-key: ${RIGOUR_AMAP_WEB_KEY:}
    connect-timeout: 3s
    read-timeout: 5s
    nearby-cache-ttl: 60s
    nearby-cache-max-entries: 500
  sales:
    temporary-checkin:
      # 临时表单默认关闭；上线时由 Nacos/Secret 注入固定租户，不接受请求覆盖。
      enabled: ${RIGOUR_SALES_TEMPORARY_CHECKIN_ENABLED:false}
      tenant-id: ${RIGOUR_SALES_TEMPORARY_CHECKIN_TENANT_ID:}
      max-storefront-photo-bytes: ${RIGOUR_SALES_TEMPORARY_CHECKIN_MAX_STOREFRONT_PHOTO_BYTES:10485760}
      max-wechat-screenshot-bytes: ${RIGOUR_SALES_TEMPORARY_CHECKIN_MAX_WECHAT_SCREENSHOT_BYTES:10485760}
      max-audio-bytes: ${RIGOUR_SALES_TEMPORARY_CHECKIN_MAX_AUDIO_BYTES:104857600}
      # 公开页面不是身份认证；距离门禁仅降低远程误打卡风险。
      max-checkin-distance-meters: ${RIGOUR_SALES_TEMPORARY_CHECKIN_MAX_DISTANCE_METERS:300}
      max-checkin-accuracy-meters: ${RIGOUR_SALES_TEMPORARY_CHECKIN_MAX_ACCURACY_METERS:200}
      # 定位新鲜度窗口；超过窗口时要求重新定位，避免复用长时间前的位置。
      max-location-age-minutes: ${RIGOUR_SALES_TEMPORARY_CHECKIN_MAX_LOCATION_AGE_MINUTES:60}
      # 姓名下拉不是身份；默认强制销售用个人码首次绑定当前浏览器。
      identity-enforcement-enabled: ${RIGOUR_SALES_TEMPORARY_CHECKIN_IDENTITY_ENFORCEMENT_ENABLED:true}
      # 两个密钥必须是至少32字节的独立 Base64 Secret，不能进入代码或日志。
      identity-signing-key-base64: ${RIGOUR_SALES_TEMPORARY_CHECKIN_IDENTITY_SIGNING_KEY_BASE64:}
      risk-hmac-key-base64: ${RIGOUR_SALES_TEMPORARY_CHECKIN_RISK_HMAC_KEY_BASE64:}
      # 与 Nginx root-only snippet 覆盖的代理标记一致，不可从浏览器透传。
      trusted-proxy-marker: ${RIGOUR_SALES_TEMPORARY_CHECKIN_TRUSTED_PROXY_MARKER:}
      credential-pbkdf2-iterations: ${RIGOUR_SALES_TEMPORARY_CHECKIN_PBKDF2_ITERATIONS:210000}
      identity-ttl-days: ${RIGOUR_SALES_TEMPORARY_CHECKIN_IDENTITY_TTL_DAYS:30}
      device-ttl-days: ${RIGOUR_SALES_TEMPORARY_CHECKIN_DEVICE_TTL_DAYS:365}
      risk-ip-networks-per-day: ${RIGOUR_SALES_TEMPORARY_CHECKIN_RISK_IP_NETWORKS_PER_DAY:4}
      risk-devices-per-day: ${RIGOUR_SALES_TEMPORARY_CHECKIN_RISK_DEVICES_PER_DAY:3}
      admin-auth:
        cookie-name: __Host-rigour-sales-checkin-admin
        session-duration: 8h
        idle-timeout: 30m
        temporary-password-ttl: 24h
        login-lock-duration: 15m
        session-touch-interval: 5m
        login-failure-threshold: 5
        pbkdf2-iterations: 310000
        # 仅用于首次从受信内部代理导入城市/账号；上线完成后必须清空并关闭入口。
        bootstrap-secret: ${RIGOUR_SALES_TEMPORARY_CHECKIN_ADMIN_BOOTSTRAP_SECRET:}
        bootstrap-proxy-marker: ${RIGOUR_SALES_TEMPORARY_CHECKIN_ADMIN_BOOTSTRAP_PROXY_MARKER:}
        # Docker 部署需显式加入实际 bridge gateway /32；不能使用0.0.0.0/0。
        bootstrap-allowed-remote-cidrs: ${RIGOUR_SALES_TEMPORARY_CHECKIN_ADMIN_BOOTSTRAP_ALLOWED_REMOTE_CIDRS:127.0.0.1/32,::1/128}
      ai:
        # 转写凭据独立显式注入；即使实际使用同一 CAM 子用户，也不从 COS 配置隐式继承。
        enabled: ${RIGOUR_SALES_TEMPORARY_CHECKIN_AI_ENABLED:false}
        secret-id: ${RIGOUR_SALES_TEMPORARY_CHECKIN_AI_SECRET_ID:}
        secret-key: ${RIGOUR_SALES_TEMPORARY_CHECKIN_AI_SECRET_KEY:}
        session-token: ${RIGOUR_SALES_TEMPORARY_CHECKIN_AI_SESSION_TOKEN:}
        region: ${RIGOUR_SALES_TEMPORARY_CHECKIN_AI_REGION:ap-shanghai}
        asr-endpoint: ${RIGOUR_SALES_TEMPORARY_CHECKIN_ASR_ENDPOINT:https://asr.tencentcloudapi.com}
        asr-engine-model-type: ${RIGOUR_SALES_TEMPORARY_CHECKIN_ASR_ENGINE_MODEL_TYPE:16k_zh_en}
        asr-channel-num: 1
        asr-res-text-format: 0
        hunyuan-endpoint: ${RIGOUR_SALES_TEMPORARY_CHECKIN_HUNYUAN_ENDPOINT:https://hunyuan.ai.tencentcloudapi.com}
        hunyuan-model: ${RIGOUR_SALES_TEMPORARY_CHECKIN_HUNYUAN_MODEL:hunyuan-turbos-latest}
        connect-timeout: 3s
        read-timeout: 60s
        max-summary-input-characters: 20000
        max-summary-output-characters: 2000
        initial-delay: 10s
        poll-interval: 15s

sales:
  evidence:
    max-photo-bytes: 12582912
    min-photo-width: 320
    min-photo-height: 240
    max-photo-pixels: 25000000
  recording:
    # 非敏感运行参数由 application/Nacos 管理；生产在 Nacos 中切换为 cos。
    storage-type: filesystem
    storage-dir: ./data/sales-recordings
    max-clip-bytes: 26214400
    # 30秒以下按误触/噪声处理：不保存音频，只登记审计元数据。
    minimum-clip-seconds: 30
    cos:
      # region 和 bucket 是非敏感资源标识，由环境配置文件覆盖。
      region:
      bucket:
      # 只有腾讯云访问凭据从进程 Secret/环境变量注入。
      secret-id: ${RIGOUR_SALES_RECORDING_COS_SECRET_ID:}
      secret-key: ${RIGOUR_SALES_RECORDING_COS_SECRET_KEY:}
      # 仅 STS 临时凭据模式需要；长期 CAM 密钥模式为空。
      session-token: ${RIGOUR_SALES_RECORDING_COS_SESSION_TOKEN:}
      connection-timeout-ms: 5000
      socket-timeout-ms: 30000
      server-side-encryption: true

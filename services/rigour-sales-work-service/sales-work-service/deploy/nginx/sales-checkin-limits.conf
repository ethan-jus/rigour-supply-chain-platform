limit_req_zone $binary_remote_addr zone=sales_checkin_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sales_checkin_location:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sales_checkin_identity:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=sales_checkin_conn:10m;

# 后台一次正常刷新包含文档、样式、脚本、多个查询和一页照片；不能共用写操作的低频额度。
# 仅 GET/HEAD 的明确页面资源免计数。媒体按当前与历史两种路由识别，其他 GET 仍受读取额度保护。
map "$request_method:$uri" $sales_checkin_admin_request_class {
    default action;
    ~^(GET|HEAD):/sales-checkin/admin/(?:$|index\.html$|admin\.(?:css|js)$) static;
    ~^(GET|HEAD):/sales-checkin/admin/(?:submissions/[0-9a-fA-F-]+/|api/v1/submissions/[0-9a-fA-F-]+/media/) media;
    ~^(GET|HEAD):/sales-checkin/admin/ read;
}
map $sales_checkin_admin_request_class $sales_checkin_admin_read_key {
    default "";
    read $binary_remote_addr;
}
map $sales_checkin_admin_request_class $sales_checkin_admin_media_key {
    default "";
    media $binary_remote_addr;
}
map $sales_checkin_admin_request_class $sales_checkin_admin_action_key {
    default "";
    action $binary_remote_addr;
}
limit_req_zone $sales_checkin_admin_read_key zone=sales_checkin_admin_read:10m rate=10r/s;
limit_req_zone $sales_checkin_admin_media_key zone=sales_checkin_admin_media:10m rate=20r/s;
limit_req_zone $sales_checkin_admin_action_key zone=sales_checkin_admin_action:10m rate=30r/m;
limit_conn_zone $sales_checkin_admin_read_key zone=sales_checkin_admin_read_conn:10m;
limit_conn_zone $sales_checkin_admin_media_key zone=sales_checkin_admin_media_conn:10m;
limit_conn_zone $sales_checkin_admin_action_key zone=sales_checkin_admin_action_conn:10m;

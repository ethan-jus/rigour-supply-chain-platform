location = /sales-checkin {
    return 308 /sales-checkin/;
}

location = /sales-checkin/admin {
    return 308 /sales-checkin/admin/;
}

# 图片缩略图和音频 Range 会产生多次同源 GET。它们仍受 Basic Auth、服务端城市范围和并发限制保护，
# 但不占用低频管理 API 的 request-rate 配额，避免正常预览触发 503。
location ^~ /sales-checkin/admin/submissions/ {
    auth_basic "Sales Check-in Admin";
    auth_basic_user_file /etc/nginx/.sales-checkin.htpasswd;

    limit_conn sales_checkin_conn 10;

    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Sales-Checkin-Admin-User $remote_user;
    proxy_set_header Authorization "";

    add_header Cache-Control "private, no-store" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /sales-checkin/admin/ {
    auth_basic "Sales Check-in Admin";
    auth_basic_user_file /etc/nginx/.sales-checkin.htpasswd;

    limit_req zone=sales_checkin_admin burst=10 nodelay;
    limit_conn sales_checkin_conn 5;

    client_max_body_size 30m;
    client_body_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # $remote_user is set only after Basic Auth succeeds. Always overwrite any client value.
    proxy_set_header X-Sales-Checkin-Admin-User $remote_user;
    # Basic Auth credentials are an Nginx concern and must not be forwarded to Java.
    proxy_set_header Authorization "";

    add_header Cache-Control "private, no-store" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /sales-checkin/api/ {
    limit_req zone=sales_checkin_public burst=20 nodelay;
    limit_conn sales_checkin_conn 10;

    client_max_body_size 30m;
    client_body_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /sales-checkin/ {
    limit_req zone=sales_checkin_public burst=20 nodelay;
    limit_conn sales_checkin_conn 10;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location = /sales-checkin {
    return 308 /sales-checkin/;
}

location = /sales-checkin/admin {
    return 308 /sales-checkin/admin/;
}

# 图片缩略图和音频 Range 会产生多次同源 GET。它们仍受应用会话、服务端城市范围和并发限制保护，
# 但不占用低频管理 API 的 request-rate 配额，避免正常预览触发 503。
location ^~ /sales-checkin/admin/submissions/ {
    limit_conn sales_checkin_conn 10;

    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Sales-Checkin-Client-IP $remote_addr;
    include /etc/nginx/snippets/sales-checkin-proxy-marker.conf;
    proxy_set_header Authorization "";

    add_header Cache-Control "private, no-store" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /sales-checkin/admin/ {
    limit_req zone=sales_checkin_admin burst=10 nodelay;
    limit_conn sales_checkin_conn 5;

    client_max_body_size 30m;
    client_body_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Sales-Checkin-Client-IP $remote_addr;
    include /etc/nginx/snippets/sales-checkin-proxy-marker.conf;
    # 不向 Java 透传浏览器自带的 Authorization。
    proxy_set_header Authorization "";

    add_header Cache-Control "private, no-store" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

# 一次性引导接口只能通过服务器回环/容器网关调用，公网始终拒绝。
location ^~ /sales-checkin/internal/ {
    deny all;
}

# 定位解析会调用高德 Web 服务，单独收紧匿名调用额度，避免消耗第三方配额。
location = /sales-checkin/api/v1/locations/resolve {
    limit_req zone=sales_checkin_location burst=10 nodelay;
    limit_conn sales_checkin_conn 5;

    client_max_body_size 64k;
    client_body_timeout 15s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

# 个人码验证独立限速。root-only snippet 必须覆盖 X-Sales-Checkin-Proxy-Marker，
# 其值与应用 RIGOUR_SALES_TEMPORARY_CHECKIN_TRUSTED_PROXY_MARKER 一致，不进 Git。
location = /sales-checkin/api/v1/identity/verify {
    limit_req zone=sales_checkin_identity burst=3 nodelay;
    limit_conn sales_checkin_conn 3;

    client_max_body_size 64k;
    client_body_timeout 15s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Sales-Checkin-Client-IP $remote_addr;
    include /etc/nginx/snippets/sales-checkin-proxy-marker.conf;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /sales-checkin/api/ {
    limit_req zone=sales_checkin_public burst=20 nodelay;
    limit_conn sales_checkin_conn 10;

    client_max_body_size 30m;
    client_body_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Sales-Checkin-Client-IP $remote_addr;
    include /etc/nginx/snippets/sales-checkin-proxy-marker.conf;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /sales-checkin/ {
    limit_req zone=sales_checkin_public burst=20 nodelay;
    limit_conn sales_checkin_conn 10;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_pass http://127.0.0.1:26886;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

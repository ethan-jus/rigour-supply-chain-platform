    username: "root"
    password: "281f54b19ac9a71025fca65e0654b23c504d3f98"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  config:
    import: "optional:nacos:rigour-common.yml,optional:nacos:${spring.application.name}.yml"
  cloud:
    nacos:
      server-addr: "192.168.12.7:18848"
      config:
        enabled: true
        namespace: "${NACOS_NAMESPACE:3aa03547-8948-4254-bd94-47c630db128b}"
      username: "nacos"
      password: "430baa72cea83cdd77b1627990f7fb2d6bfe0622"
      discovery:
        namespace: "${NACOS_NAMESPACE:3aa03547-8948-4254-bd94-47c630db128b}"
        register-enabled: true
  data:
    redis:
      host: "192.168.12.7"
      port: 16379
      password: "bf34d06b828c6a2045152916d7a151efff33bf7f"
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    out-of-order: false
  application:

rigour:
  crm:
    # 飞书门店历史与订货宝客户建档口径的切换点（北京时间 9 月 4 日零点）。
    customer-history-cutover: "2026-09-03T16:00:00Z"
  supply-authorization:
    iam-base-url: "http://rigour-tenant-iam-service"
  context:
    trust:
      active-key-id: "v1"
      keys-base64:
        v1: "${RIGOUR_CONTEXT_TRUST_KEY_V1}"
  business-settings:
    base-url: "${RIGOUR_BUSINESS_SETTINGS_BASE_URL:http://rigour-business-settings-service}"
  hr:
    base-url: "${RIGOUR_HR_BASE_URL:http://rigour-hr-payroll-service}"
  integration:
    base-url: "${RIGOUR_INTEGRATION_BASE_URL:http://rigour-integration-migration-service}"

# 日常开发选择 dev：基础设施统一使用台式机 192.168.12.7，不需要本机安装中间件。
# DEV账号仅用于开发；COS/签名密钥沿用IDEA环境变量，不在Git保存云密钥。
# 本机不注册到共享服务池、不自动迁移数据库；台式机部署仍由部署脚本管理。
server:
  port: 26880
spring:
  cloud:
    nacos:
      server-addr: "192.168.12.7:18848"
      config:
        enabled: false
        import-check:
          enabled: false
        namespace: "3aa03547-8948-4254-bd94-47c630db128b"
      username: "nacos"
      password: "430baa72cea83cdd77b1627990f7fb2d6bfe0622"
      discovery:
        namespace: "3aa03547-8948-4254-bd94-47c630db128b"
        register-enabled: false
  flyway:
    enabled: false
  application:
    name: "rigour-api-gateway"
rigour:
  gateway:
    security:
      enabled: true
      allow-insecure-http: true
      issuer: "http://localhost:26881"
      jwk-set-uri: "http://localhost:26881/oauth2/jwks"
      iam-current-token-uri: "http://localhost:26881/api/v1/token/current"
      current-token-validation-enabled: true
      allow-insecure-loopback: true
  context:
    trust:
      active-key-id: "v1"
      keys-base64:
        v1: "${RIGOUR_CONTEXT_TRUST_KEY_V1}"
IAM_SERVICE_URL: "http://localhost:26881"
BUSINESS_SETTINGS_SERVICE_URL: "http://192.168.12.7:26892"
# 部门、员工及任职维护使用 IDEA 本机新版 HR，数据库仍使用共享 DEV。
HR_SERVICE_URL: "http://localhost:26889"
CRM_SERVICE_URL: "http://localhost:26883"
ERP_SERVICE_URL: "http://192.168.12.7:26884"
# 订单及业务参数由 IDEA 本机新版服务处理，避免转入台式机旧接口。
ORDER_SERVICE_URL: "http://localhost:26885"
SALES_SERVICE_URL: "http://192.168.12.7:26886"
AI_SERVICE_URL: "http://192.168.12.7:26887"
BI_SERVICE_URL: "http://192.168.12.7:26888"
INTEGRATION_SERVICE_URL: "http://localhost:26882"

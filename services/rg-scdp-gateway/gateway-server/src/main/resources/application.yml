server:
  port: 26880

spring:
  application:
    name: rigour-api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: scdp-identity
              uri: lb://rigour-tenant-iam-service
              predicates:
                - Path=/api/v1/me,/api/v1/scdp/**,/api/v1/management/supply/**,/api/v1/management/bi/**
            - id: tenant-iam
              uri: lb://rigour-tenant-iam-service
              predicates:
                - Path=/api/v1/iam/**
            - id: feishu-auth
              uri: lb://rigour-tenant-iam-service
              predicates:
                - Path=/api/v1/auth/feishu/**
            - id: feishu-platform
              uri: lb://rigour-integration-migration-service
              predicates:
                - Path=/api/v1/platform/feishu/**
            - id: integration-migration
              uri: lb://rigour-integration-migration-service
              predicates:
                - Path=/api/v1/integration/**
            - id: merchant-crm
              uri: lb://rigour-merchant-crm-service
              predicates:
                - Path=/api/v1/crm/**
            - id: erp-core
              uri: lb://rigour-erp-core-service
              predicates:
                - Path=/api/v1/erp/**
            - id: order-center
              uri: lb://rigour-order-center-service
              predicates:
                - Path=/api/v1/orders/**
            - id: sales-work
              uri: lb://rigour-sales-work-service
              predicates:
                - Path=/api/v1/sales/**
            - id: ai-agent
              uri: lb://rigour-ai-agent-service
              predicates:
                - Path=/api/v1/ai/**
            - id: analytics-bi
              uri: lb://rigour-analytics-bi-service
              predicates:
                - Path=/api/v1/analytics/**
            - id: hr-payroll
              uri: lb://rigour-hr-payroll-service
              predicates:
                - Path=/api/v1/hr/**
            - id: business-settings
              uri: lb://rigour-business-settings-service
              predicates:
                - Path=/api/v1/business-settings/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

rigour:
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

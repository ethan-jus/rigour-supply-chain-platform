# 个人配置：选择 local 时自动复用 DEV；在 --- 之后覆盖自己需要的配置即可。
# 例如在下面添加 spring.datasource.url/username/password，改用自己的数据库。
# 不需要个人覆盖时直接选择 dev；个人修改不要提交到团队分支。
spring:
  config:
    import: "application-dev.yml"
---
server:
  port: 26880
# 本机开发：服务间调用全部指向本机，起哪个用哪个，没起的报错是预期行为。
# Nacos 仍继承 dev 的台式机地址，不需要本机安装中间件；网关自身不连数据库和 Redis。
# IAM/HR/CRM/ORDER/INTEGRATION 在 dev 里已是 localhost，这里不重复声明。
BUSINESS_SETTINGS_SERVICE_URL: "http://localhost:26892"
ERP_SERVICE_URL: "http://localhost:26884"
SALES_SERVICE_URL: "http://localhost:26886"
AI_SERVICE_URL: "http://localhost:26887"
BI_SERVICE_URL: "http://localhost:26888"

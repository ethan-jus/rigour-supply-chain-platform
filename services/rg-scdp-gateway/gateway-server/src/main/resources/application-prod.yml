# 生产独立配置：部署时提供生产参数，缺失则启动失败；绝不回退到DEV数据库。
# 生产地址和账号尚未指定，此文件是生产配置入口，不代表生产环境已部署。
spring:
  application:
    name: "rigour-api-gateway"
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR}"
      username: "${NACOS_USERNAME}"
      password: "${NACOS_PASSWORD}"
      discovery:
        namespace: "${NACOS_NAMESPACE}"
        register-enabled: true
      config:
        enabled: false
        import-check:
          enabled: false
  flyway:
    enabled: false
rigour:
  context:
    trust:
      active-key-id: "v1"
      keys-base64:
        v1: "${RIGOUR_CONTEXT_TRUST_KEY_V1}"
  gateway:
    security:
      enabled: true
      allow-insecure-http: false
      allow-insecure-loopback: false
      issuer: "${IAM_ISSUER}"
      jwk-set-uri: "${IAM_JWK_SET_URI}"
      iam-current-token-uri: "${IAM_CURRENT_TOKEN_URI}"
      current-token-validation-enabled: true
IAM_SERVICE_URL: "${PROD_IAM_SERVICE_URL}"
BUSINESS_SETTINGS_SERVICE_URL: "${PROD_BUSINESS_SETTINGS_SERVICE_URL}"
HR_SERVICE_URL: "${PROD_HR_SERVICE_URL}"
CRM_SERVICE_URL: "${PROD_CRM_SERVICE_URL}"
ERP_SERVICE_URL: "${PROD_ERP_SERVICE_URL}"
ORDER_SERVICE_URL: "${PROD_ORDER_SERVICE_URL}"
SALES_SERVICE_URL: "${PROD_SALES_SERVICE_URL}"
AI_SERVICE_URL: "${PROD_AI_SERVICE_URL}"
BI_SERVICE_URL: "${PROD_BI_SERVICE_URL}"
INTEGRATION_SERVICE_URL: "${PROD_INTEGRATION_SERVICE_URL}"

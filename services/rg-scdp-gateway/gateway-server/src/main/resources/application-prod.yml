# 生产环境只从部署进程读取凭据；Nacos 仅保存非敏感动态参数。
# NACOS_NAMESPACE 填 scm-prod 的实际命名空间 ID，不能误填显示名称或复用其他环境。
spring:
  application:
    name: rigour-api-gateway
  config:
    import: "optional:nacos:rigour-common.yml,optional:nacos:${spring.application.name}.yml"
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR}"
      username: "${NACOS_USERNAME}"
      password: "${NACOS_PASSWORD}"
      discovery:
        namespace: "${NACOS_NAMESPACE}"
        ip: "${SERVICE_BIND_ADDRESS:127.0.0.1}"
        register-enabled: true
      config:
        enabled: true
        namespace: "${NACOS_NAMESPACE}"
        group: DEFAULT_GROUP
        file-extension: yml
  flyway:
    # 从 DEV 全量 SQL 导入，生产启动不执行迁移或自动基线。
    enabled: false
    clean-disabled: true

server:
  address: "${SERVICE_BIND_ADDRESS:127.0.0.1}"
  port: 26880
  tomcat:
    threads:
      max: 32
      min-spare: 2
    max-connections: 128
    accept-count: 64
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

rigour:
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: "${RIGOUR_CONTEXT_TRUST_KEY_V1}"
  gateway:
    security:
      current-token-read-timeout: 60s
      enabled: true
      issuer: "${OIDC_ISSUER}"
      jwk-set-uri: "${IAM_JWK_SET_URI:http://rigour-tenant-iam-service/oauth2/jwks}"
      iam-current-token-uri: "http://rigour-tenant-iam-service/api/v1/token/current"
      current-token-validation-enabled: true
      allow-insecure-loopback: ${OIDC_ALLOW_HTTP_LOOPBACK:false}
      # 同机 HTTP 的 Nacos 服务名调用需显式打开；对外仍只经 Nginx 2026 入口。
      allow-insecure-http: ${GATEWAY_ALLOW_INTERNAL_HTTP:false}

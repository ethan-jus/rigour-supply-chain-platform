server:
  port: 26881
  servlet:
    session:
      cookie:
        name: RIGOUR_IAM_SESSION
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: rigour-tenant-iam-service
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.rigour.tenant.iam.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
  global-config:
    banner: false
    db-config:
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

rigour:
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}
  iam:
    feishu:
      enabled: false
      # App ID由环境覆盖层提供；App Secret只能进入IAM进程Secret，禁止写入Git、Nacos或日志。
      app-secret: ${RIGOUR_FEISHU_APP_SECRET:}
      connect-timeout: 3s
      read-timeout: 5s
      token-safety-window: 60s
      session-time-to-live: 8h
      access-token-time-to-live: 1h
    bootstrap:
      platform-admin:
        enabled: false
      tenant-admin:
        enabled: false
      portal-client:
        enabled: false
        client-id: rigour-portal-browser
    authentication:
      password:
        maximum-failed-attempts: 5
        lock-duration: 15m
        session-time-to-live: 8h
    oidc:
      server:
        enabled: false
        issuer: https://iam.dev.rigour.local
        allowed-origins: []
      signing:
        enabled: false
        minimum-rsa-bits: 3072
      token:
        access-token-audience:
          - rigour-api
      authorization-attributes:
        enabled: false

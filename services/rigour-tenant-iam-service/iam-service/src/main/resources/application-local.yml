server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  cloud:
    nacos:
      discovery:
        # 本机服务只读取共享DEV配置，不向共享注册中心发布开发者电脑地址。
        register-enabled: ${NACOS_DISCOVERY_REGISTER_ENABLED:false}

rigour:
  iam:
    bootstrap:
      local-signing-key:
        enabled: ${IAM_LOCAL_SIGNING_KEY_BOOTSTRAP_ENABLED:false}
      portal-client:
        enabled: ${IAM_PORTAL_CLIENT_BOOTSTRAP_ENABLED:false}
        allow-insecure-loopback: true
        redirect-uri: http://localhost:5100/oidc/callback
        post-logout-redirect-uri: http://localhost:5100/
    oidc:
      server:
        enabled: ${IAM_OIDC_SERVER_ENABLED:false}
        allow-insecure-loopback: true
        issuer: http://localhost:26881
        allowed-origins:
          - http://localhost:5100
      signing:
        enabled: ${IAM_OIDC_SIGNING_ENABLED:false}
      authorization-attributes:
        enabled: ${IAM_OIDC_AUTHORIZATION_STORE_ENABLED:false}
        active-key-version: v1
        # 开发人员共用DEV数据库时也必须注入同一个持久AES密钥；禁止进程级随机密钥写入共享数据。
        allow-ephemeral-local-key: false

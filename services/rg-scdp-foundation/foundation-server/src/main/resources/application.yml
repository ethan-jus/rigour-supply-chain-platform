server:
  port: 26892

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/bootstrap
  application:
    name: rigour-business-settings-service
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

rigour:
  query-cache:
    enabled: ${QUERY_CACHE_ENABLED:true}
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

      refresh:
        enabled: false
        fixed-delay-ms: 3600000
        initial-delay-ms: 3600000
  context:
    trust:
      active-key-id: test
      keys-base64:
        test: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

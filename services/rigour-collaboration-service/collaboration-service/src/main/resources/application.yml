server:
  port: 26893

spring:
  application:
    name: rigour-collaboration-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

rigour:
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

collaboration:
  max-group-members: 500
  max-message-text-length: 4000
  max-attachment-bytes: 52428800
  livekit:
    url: ${RIGOUR_LIVEKIT_URL:}
    api-key: ${RIGOUR_LIVEKIT_API_KEY:}
    api-secret: ${RIGOUR_LIVEKIT_API_SECRET:}
    token-ttl: 30m

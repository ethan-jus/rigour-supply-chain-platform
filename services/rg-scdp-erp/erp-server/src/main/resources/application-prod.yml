# 生产环境只从部署进程读取凭据；Nacos 仅保存非敏感动态参数。
# NACOS_NAMESPACE 填 scm-prod 的实际命名空间 ID，不能误填显示名称或复用其他环境。
spring:
  application:
    name: rigour-erp-core-service
  config:
    import: "optional:nacos:rigour-common.yml,optional:nacos:${spring.application.name}.yml"
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR}"
      username: "${NACOS_USERNAME}"
      password: "${NACOS_PASSWORD}"
      discovery:
        namespace: "${NACOS_NAMESPACE}"
        ip: "${SERVICE_BIND_ADDRESS:127.0.0.1}"
        register-enabled: true
      config:
        enabled: true
        namespace: "${NACOS_NAMESPACE}"
        group: DEFAULT_GROUP
        file-extension: yml
  flyway:
    # 从 DEV 全量 SQL 导入，生产启动不执行迁移或自动基线。
    enabled: false
    clean-disabled: true
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 1
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:60000}
      data-source-properties:
        rewriteBatchedStatements: true
  data:
    redis:
      host: "${REDIS_HOST}"
      port: ${REDIS_PORT}
      password: "${REDIS_PASSWORD}"
      database: 0

server:
  address: "${SERVICE_BIND_ADDRESS:127.0.0.1}"
  port: 26884
  tomcat:
    threads:
      max: 32
      min-spare: 2
    max-connections: 128
    accept-count: 64
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

rigour:
  supply-authorization:
    read-timeout: 60s
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: "${RIGOUR_CONTEXT_TRUST_KEY_V1}"
  erp:
    product-media:
      cos:
        region: "${RIGOUR_COS_REGION}"
        bucket: "${RIGOUR_COS_BUCKET}"
        secret-id: "${RIGOUR_COS_SECRET_ID}"
        secret-key: "${RIGOUR_COS_SECRET_KEY}"

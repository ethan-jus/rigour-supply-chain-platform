server:
  port: 26884

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/bootstrap
  application:
    name: rigour-erp-core-service
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

rigour:
  business-settings:
    # ERP 对明确白名单字段按字典批量自动补齐，不逐条远程解析业务数据。
    base-url: ${RIGOUR_BUSINESS_SETTINGS_BASE_URL:http://rigour-business-settings-service}
  integration:
    # ERP 只调用 Integration 版本化契约，不直接访问订货宝或 Integration 数据库。
    base-url: ${RIGOUR_INTEGRATION_BASE_URL:http://rigour-integration-migration-service}
    http:
      connect-timeout: ${RIGOUR_INTEGRATION_CONNECT_TIMEOUT:3s}
      # 商品图片会在 Integration 返回商品页前完成下载和 COS 上传，允许一个批次最多等待 120 秒。
      read-timeout: ${RIGOUR_INTEGRATION_READ_TIMEOUT:120s}
  erp:
    product-media:
      # 数据库仅保存 object key；每次查询都由 ERP 重新生成 COS 私桶短时 URL。
      url-ttl: 10m
      cos:
        # region 和 bucket 是非敏感资源标识，通常由 Nacos 注入；统一环境变量可覆盖本地配置。
        object-prefix: ${RIGOUR_ERP_PRODUCT_MEDIA_COS_OBJECT_PREFIX:product-images}
        region: ${RIGOUR_COS_REGION:ap-beijing}
        bucket: ${RIGOUR_COS_BUCKET:rigour-sales-recordings-1361731487}
        # 全供应链共用一套 COS 凭据（RIGOUR_COS_*）；服务专用旧变量名兼容回退。
        secret-id: ${RIGOUR_COS_SECRET_ID:${RIGOUR_ERP_PRODUCT_MEDIA_COS_SECRET_ID:}}
        secret-key: ${RIGOUR_COS_SECRET_KEY:${RIGOUR_ERP_PRODUCT_MEDIA_COS_SECRET_KEY:}}
        session-token: ${RIGOUR_COS_SESSION_TOKEN:${RIGOUR_ERP_PRODUCT_MEDIA_COS_SESSION_TOKEN:}}
        connection-timeout-ms: 5000
        socket-timeout-ms: 30000
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

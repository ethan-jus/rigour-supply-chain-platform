server:
  port: 26888

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/bootstrap
  application:
    name: rigour-analytics-bi-service
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

rigour:
  query-cache:
    enabled: ${QUERY_CACHE_ENABLED:true}
    namespace: ${QUERY_CACHE_NAMESPACE:${spring.profiles.active:local}:${NACOS_NAMESPACE:default}:bi}
    command-timeout-ms: ${QUERY_CACHE_COMMAND_TIMEOUT_MS:500}
    max-entry-bytes: 2097152
    max-tenant-bytes: 33554432
    max-concurrent-loads: 16
  analytics:
    supply-dashboard:
      refresh:
        enabled: ${RIGOUR_ANALYTICS_SUPPLY_REFRESH_ENABLED:true}
        fixed-delay-ms: ${RIGOUR_ANALYTICS_SUPPLY_REFRESH_FIXED_DELAY_MS:3600000}
        initial-delay-ms: ${RIGOUR_ANALYTICS_SUPPLY_REFRESH_INITIAL_DELAY_MS:60000}
        lookback: ${RIGOUR_ANALYTICS_SUPPLY_REFRESH_LOOKBACK:PT2H}
        lock-ttl: ${RIGOUR_ANALYTICS_SUPPLY_REFRESH_LOCK_TTL:PT55M}
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

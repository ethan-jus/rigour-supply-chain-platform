# 日常开发选择 dev：基础设施统一使用台式机 192.168.12.7，不需要本机安装中间件。
# DEV账号仅用于开发；COS/签名密钥沿用IDEA环境变量，不在Git保存云密钥。
# 本机注册到 DEV 命名空间，服务间按服务名解析实例；台式机部署仍由部署脚本管理。
server:
  port: 26882
spring:
  datasource:
    url: "jdbc:mysql://192.168.12.7:13306/rigour_integration?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true"
    username: "root"
    password: "281f54b19ac9a71025fca65e0654b23c504d3f98"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  config:
    import: "optional:nacos:rigour-common.yml,optional:nacos:${spring.application.name}.yml"
  cloud:
    nacos:
      server-addr: "192.168.12.7:18848"
      config:
        enabled: true
        namespace: "${NACOS_NAMESPACE:3aa03547-8948-4254-bd94-47c630db128b}"
      username: "nacos"
      password: "430baa72cea83cdd77b1627990f7fb2d6bfe0622"
      discovery:
        namespace: "${NACOS_NAMESPACE:3aa03547-8948-4254-bd94-47c630db128b}"
        register-enabled: true
  data:
    redis:
      host: "192.168.12.7"
      port: 16379
      password: "bf34d06b828c6a2045152916d7a151efff33bf7f"
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/bootstrap
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    out-of-order: false
  application:
    name: "rigour-integration-migration-service"
rocketmq:
  name-server: "192.168.12.7:19876"
rigour:
  supply-authorization:
    iam-base-url: "http://rigour-tenant-iam-service"
  context:
    trust:
      active-key-id: "v1"
      keys-base64:
        v1: "${RIGOUR_CONTEXT_TRUST_KEY_V1}"
  integration:
    product-media:
      worker-enabled: false
      cos:
        region: "ap-beijing"
        bucket: "rigour-sales-recordings-1361731487"
        secret-id: "${RIGOUR_INTEGRATION_PRODUCT_MEDIA_COS_SECRET_ID}"
        secret-key: "${RIGOUR_INTEGRATION_PRODUCT_MEDIA_COS_SECRET_KEY}"
    dhb:
      orchestration:
        enabled: false
        # 仅用于定时统一同步（本环境 enabled=false）。订单页「同步订单」按钮走 incremental-window-from，
        # 未配置时使用代码默认 2026-09-04T00:00:00+08:00（订单业务分界）。
        # 订货宝当前数据自 2026-08-18 起（2026-09-18 只读核对：8-18 之前订单查询 total=0）。
        scheduled-window-from: "2026-08-18T00:00:00+08:00"
    feishu:
      app-id: "cli_aafff3a596b89cdc"
      allowed-origins: "http://localhost:5200"
      allow-insecure-lan: true
      import-bundle:
        default-source-url: "${RIGOUR_FEISHU_IMPORT_BUNDLE_DEFAULT_SOURCE_URL:https://mcn7tpu25x8w.feishu.cn/base/LUvobJ32Fa1dKesorBhc7VF8nye}"
  business-settings:
    base-url: "${RIGOUR_BUSINESS_SETTINGS_BASE_URL:http://rigour-business-settings-service}"
  hr:
    base-url: "${RIGOUR_HR_BASE_URL:http://rigour-hr-payroll-service}"
  crm:
    base-url: "${RIGOUR_CRM_BASE_URL:http://rigour-merchant-crm-service}"
  erp:
    base-url: "${RIGOUR_ERP_BASE_URL:http://rigour-erp-core-service}"
  order:
    base-url: "${RIGOUR_ORDER_BASE_URL:http://rigour-order-center-service}"

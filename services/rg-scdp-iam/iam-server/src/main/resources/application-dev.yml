# 日常开发选择 dev：基础设施统一使用台式机 192.168.12.7，不需要本机安装中间件。
# DEV账号仅用于开发；COS/签名密钥沿用IDEA环境变量，不在Git保存云密钥。
# 本机注册到 DEV 命名空间，服务间按服务名解析实例；Flyway 在 dev 启动时校验并执行本服务尚未应用的迁移。
server:
  port: 26881
  servlet:
    session:
      cookie:
        secure: false
spring:
  datasource:
    url: "jdbc:mysql://192.168.12.7:13306/rigour_iam?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true"
    username: "root"
    password: "281f54b19ac9a71025fca65e0654b23c504d3f98"
    hikari:
      maximum-pool-size: 10
  config:
    import: "optional:nacos:rigour-common.yml,optional:nacos:${spring.application.name}.yml"
  cloud:
    nacos:
      server-addr: "192.168.12.7:18848"
      config:
        enabled: true
        namespace: "${NACOS_NAMESPACE:3aa03547-8948-4254-bd94-47c630db128b}"
      username: "nacos"
      password: "430baa72cea83cdd77b1627990f7fb2d6bfe0622"
      discovery:
        namespace: "${NACOS_NAMESPACE:3aa03547-8948-4254-bd94-47c630db128b}"
        register-enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/bootstrap
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    out-of-order: false
  application:
    name: "rigour-tenant-iam-service"
  data:
    redis:
      host: "192.168.12.7"
      port: 16379
      password: "bf34d06b828c6a2045152916d7a151efff33bf7f"
rigour:
  iam:
    # 服务名寻址：地址由 Nacos 注册中心解析实例，如需临时直连可覆盖同名环境变量。
    hr-base-url: "${HR_PAYROLL_BASE_URL:http://rigour-hr-payroll-service}"
    crm-base-url: "${MERCHANT_CRM_BASE_URL:http://rigour-merchant-crm-service}"
    erp-base-url: "${ERP_CORE_BASE_URL:http://rigour-erp-core-service}"
    feishu:
      enabled: "${RIGOUR_FEISHU_ENABLED:false}"
      app-id: "cli_aafff3a596b89cdc"
    oidc:
      server:
        enabled: true
        issuer: "http://localhost:26881"
        allowed-origins:
          - "http://localhost:5100"
        allow-insecure-lan: true
        allow-insecure-loopback: true
      signing:
        enabled: true
      authorization-attributes:
        enabled: true
        active-key-version: "v1"
        keys-base64:
          v1: "${IAM_OIDC_AUTH_ATTRIBUTES_KEY_V1}"
        allow-ephemeral-local-key: false
    bootstrap:
      local-signing-key:
        enabled: false
      scdp-client:
        enabled: false
      tenant-admin:
        enabled: false
  context:
    trust:
      active-key-id: "v1"
      keys-base64:
        v1: "${RIGOUR_CONTEXT_TRUST_KEY_V1}"

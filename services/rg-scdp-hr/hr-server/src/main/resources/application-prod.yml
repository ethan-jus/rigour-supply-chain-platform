# 生产独立配置：部署时提供生产参数，缺失则启动失败；绝不回退到DEV数据库。
# 生产地址和账号尚未指定，此文件是生产配置入口，不代表生产环境已部署。
spring:
  application:
    name: "rigour-hr-payroll-service"
  config:
    import:
      - "nacos:rigour-hr-prod.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      server-addr: "127.0.0.1:8848"
      username: "${NACOS_USERNAME}"
      password: "${NACOS_PASSWORD}"
      discovery:
        namespace: "516560f3-8b30-4975-84cb-c55f89b912ae"
        register-enabled: true
      config:
        enabled: true # 开启配置中心
        namespace: "516560f3-8b30-4975-84cb-c55f89b912ae" # 截图里的命名空间ID
        group: "DEFAULT_GROUP"
        file-extension: "yaml"
  flyway:
    enabled: false

server:
  port: 26889
  servlet:
    session:
      cookie:
        secure: false # 前端是 http 时必须改 false


server:
  port: 26889

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    locations: classpath:db/migration,classpath:db/bootstrap
  application:
    name: rigour-hr-payroll-service
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.rigour: INFO

rigour:
  context:
    trust:
      active-key-id: v1
      keys-base64:
        v1: ${RIGOUR_CONTEXT_TRUST_KEY_V1:}

# 个人配置：选择 local 时自动复用 DEV；在 --- 之后覆盖自己需要的配置即可。
# 例如在下面添加 spring.datasource.url/username/password，改用自己的数据库。
# 不需要个人覆盖时直接选择 dev；个人修改不要提交到团队分支。
spring:
  config:
    import: "application-dev.yml"
# 个人命名空间：本机服务只注册到/发现该命名空间，与共享 DEV 及同事实例隔离；修改只动这一处。
# 必须写在 --- 之前的文档里：Nacos 配置导入在此文档的导入阶段解析命名空间。
NACOS_NAMESPACE: "ethan-local"
---
server:
  port: 26885
